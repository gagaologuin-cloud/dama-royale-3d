      _ensureCtx() {
        const Ctx = window.AudioContext || window.webkitAudioContext;

      _hitBass(ctx, now, freq, dur, gainPeak) {
        const osc = ctx.createOscillator();
        const g = ctx.createGain();
        osc.type = "sawtooth";
        osc.frequency.setValueAtTime(freq * 1.45, now);
        osc.frequency.exponentialRampToValueAtTime(freq, now + 0.045);
        osc.frequency.exponentialRampToValueAtTime(Math.max(36, freq * 0.65), now + dur);
        g.gain.setValueAtTime(0.001, now);
        g.gain.linearRampToValueAtTime(gainPeak, now + 0.012);
        g.gain.exponentialRampToValueAtTime(0.001, now + dur);
        osc.connect(g);
        g.connect(ctx.destination);
        osc.start(now);
        osc.stop(now + dur + 0.02);
      },

      _hitCowbell(ctx, now, baseFreq, gainPeak) {
        [baseFreq, baseFreq * 1.48].forEach((f, idx) => {
          const osc = ctx.createOscillator();
          const filter = ctx.createBiquadFilter();
          const g = ctx.createGain();
          osc.type = idx === 0 ? "square" : "triangle";
          osc.frequency.setValueAtTime(f, now);
          filter.type = "bandpass";
          filter.frequency.setValueAtTime(f * 1.25, now);
          filter.Q.setValueAtTime(4.5, now);
          g.gain.setValueAtTime(0.001, now);
          g.gain.linearRampToValueAtTime(gainPeak, now + 0.004);
          g.gain.exponentialRampToValueAtTime(0.0008, now + 0.11);
          osc.connect(filter);
          filter.connect(g);
          g.connect(ctx.destination);
          osc.start(now);
          osc.stop(now + 0.13);
        });
      },

      _hitHat(ctx, now, openHat, gainPeak) {
        const len = Math.floor(ctx.sampleRate * (openHat ? 0.09 : 0.03));
        const buf = ctx.createBuffer(1, len, ctx.sampleRate);
        const data = buf.getChannelData(0);
        for (let i = 0; i < len; i++) data[i] = (Math.random() * 2 - 1) * (1 - i / len);
        const src = ctx.createBufferSource();
        src.buffer = buf;
        const hp = ctx.createBiquadFilter();
        hp.type = "highpass";
        hp.frequency.setValueAtTime(6800, now);
        const g = ctx.createGain();
        g.gain.setValueAtTime(gainPeak, now);
        g.gain.exponentialRampToValueAtTime(0.0008, now + (openHat ? 0.085 : 0.028));
        src.connect(hp);
        hp.connect(g);
        g.connect(ctx.destination);
        src.start(now);
      },

      _startSynthLoop() {
        if (!this._unlocked || !this.enabled) return;
        const ctx = this._ensureCtx();
        if (!ctx) return;
        if (this._timer) clearInterval(this._timer);
        const bassNotes = [65.41, 0, 65.41, 77.78, 0, 65.41, 87.31, 73.42, 65.41, 0, 65.41, 98.0, 87.31, 0, 77.78, 73.42];
        const bellNotes = [587.33, 0, 783.99, 587.33, 880.0, 0, 783.99, 659.25, 587.33, 0, 783.99, 987.77, 880.0, 783.99, 659.25, 0];
        const stepMs = this.mode === "game" ? 117 : 125;
        const volScale = this.mode === "game" ? 1.15 : 0.85;
        this._timer = setInterval(() => {
          if (!this.enabled) return this.stop();
          const c = this._ensureCtx();
          if (!c) return;
          const now = c.currentTime + 0.01;

          if (bassNotes[s]) this._hitBass(c, now, bassNotes[s], 0.22, 0.085 * volScale);
          if (bellNotes[s]) this._hitCowbell(c, now, bellNotes[s], 0.045 * volScale);
          if (s % 2 === 0 || this.mode === "game") {
            this._hitHat(c, now, s % 4 === 2, 0.022 * volScale);

          this._step++;
        }, stepMs);

    // ===== DAMA ENGINE =====
    const D = [[-1, -1], [-1, 1], [1, -1], [1, 1]];
    const ow = (v) => (v ? (v % 2 ? 1 : 2) : 0);
    const kg = (v) => v > 2;
    const In = (r, c) => r >= 0 && r < 8 && c >= 0 && c < 8;

    function caps(b, s, p, out) {
      const k = kg(b[s]);
      const bb = b.slice();
      bb[s] = 0;
      (function j(pos, cap, path) {
        let f = 0;
        for (const [dr, dc] of D) {
          let r = (pos / 8 | 0) + dr, c = (pos % 8) + dc;
          if (k) while (In(r, c) && !bb[r * 8 + c]) { r += dr; c += dc; }
          if (!In(r, c)) continue;
          const q = r * 8 + c;
          if (ow(bb[q]) !== 3 - p || cap.includes(q)) continue;
          r += dr; c += dc;
          while (In(r, c) && !bb[r * 8 + c]) {
            f = 1;
            const l = r * 8 + c;
            j(l, [...cap, q], [...path, l]);
            if (!k) break;
            r += dr; c += dc;
          }
        }
        if (!f && cap.length) out.push({ p: path, c: cap });
      })(s, [], [s]);
    }

    function moves(b, p) {
      const o = [];
      for (let i = 0; i < 64; i++) if (ow(b[i]) === p) caps(b, i, p, o);
      if (o.length) return o;
      for (let i = 0; i < 64; i++) {
        if (ow(b[i]) === p) {
          const k = kg(b[i]);
          for (const [dr, dc] of D) {
            if (!k && dr !== (p === 1 ? -1 : 1)) continue;
            let r = (i / 8 | 0) + dr, c = (i % 8) + dc;
            while (In(r, c) && !b[r * 8 + c]) {
              o.push({ p: [i, r * 8 + c], c: [] });
              if (!k) break;
              r += dr; c += dc;
            }
          }
        }
      }
      return o;
    }

    function ap(b, m) {
      const n = b.slice();
      const s = m.p[0], e = m.p[m.p.length - 1];
      let v = n[s];
      n[s] = 0;
      m.c.forEach((i) => { n[i] = 0; });
      if (v < 3 && ((v === 1 && e < 8) || (v === 2 && e > 55))) v += 2;
      n[e] = v;
      return n;
    }

    const ev = (b, p) => b.reduce((sum, v) => (v ? sum + (ow(v) === p ? 1 : -1) * (v > 2 ? 3 : 1) : sum), 0);

    function mm(b, t, p, d, a, be) {
      const ms = moves(b, t);
      if (!ms.length) return t === p ? -99 : 99;
      if (!d) return ev(b, p);
      let best = t === p ? -1e3 : 1e3;
      for (const m of ms) {
        const val = mm(ap(b, m), 3 - t, p, d - 1, a, be);
        if (t === p) { best = Math.max(best, val); a = Math.max(a, val); }
        else { best = Math.min(best, val); be = Math.min(be, val); }
        if (be <= a) break;
      }
      return best;
    }

    function ai(b, p, lv) {
      let ms = moves(b, p);
      if (!ms.length) return null;
      if (lv === 0) return ms[rnd(ms.length)];
      if (lv === 1) {
        const mx = Math.max(...ms.map((m) => m.c.length));
        ms = ms.filter((m) => m.c.length === mx);
        return ms[rnd(ms.length)];
      }
      const d = lv === 2 ? 1 : 3;
      let bs = -1e4, bm = [];
      for (const m of ms) {
        const val = mm(ap(b, m), 3 - p, p, d, -1e4, 1e4);
        if (val > bs) { bs = val; bm = [m]; }
        else if (val === bs) bm.push(m);

    async function rtcStart(room, caller) {
      const P = pc = new RTCPeerConnection(RTC_CFG);
      camStream.getTracks().forEach((t) => P.addTrack(t, camStream));
      P.ontrack = (ev) => {
        const o = $("#oppCam");
        if (o && ev.streams[0]) {

          o.classList.add("on");
          o.play().catch(() => {});

      const sig = FDB.ref(`rtc/${room}`);
      const me = caller ? "p1" : "p2", opp = caller ? "p2" : "p1", q = [];
      let ready = false;
      camCtx = { sig, me, caller };
      const flush = async () => {
        ready = true;
        for (const c of q.splice(0)) await P.addIceCandidate(new RTCIceCandidate(c)).catch(() => {});
      };
      P.onicecandidate = (ev) => { if (ev.candidate) sig.child(`${me}/candidates`).push(ev.candidate.toJSON()); };
      if (caller) {
        const o = await P.createOffer();
        await P.setLocalDescription(o);
        await sig.child("offer").set({ type: o.type, sdp: o.sdp });
      }
      const a = sig.child("offer").on("value", async (s) => {
        const v = s.val();
        if (!caller && v && !P.remoteDescription) {
          await P.setRemoteDescription(new RTCSessionDescription(v));
          const an = await P.createAnswer();
          await P.setLocalDescription(an);
          await sig.child("answer").set({ type: an.type, sdp: an.sdp });
          await flush();
        }
      });
      const b = sig.child("answer").on("value", async (s) => {
        const v = s.val();
        if (caller && v && !P.remoteDescription) {
          await P.setRemoteDescription(new RTCSessionDescription(v));
          await flush();
        }
      });
      const c = sig.child(`${opp}/candidates`).on("child_added", (s) => {
        const x = s.val();
        if (!x) return;
        if (ready) P.addIceCandidate(new RTCIceCandidate(x)).catch(() => {});
        else q.push(x);
      });
      rtcOff = [
        () => sig.child("offer").off("value", a),
        () => sig.child("answer").off("value", b),
        () => sig.child(`${opp}/candidates`).off("child_added", c)
      ];
    }

      go("store");
    }

    function applyPurchase(p) {
      if (p.kind === "coins") addCoins(p.amt);
      else if (p.kind === "mem") { S.mem = { sku: p.sku, until: p.days ? Date.now() + p.days * 864e5 : 0 }; sv(); }
      else { S.own[p.id] = 1; sv(); }
    }

    // ===== MARKETPLACE =====
    let mt = "b";
    const nmI = (id) => (IT.find((x) => x[1] === id) || [])[2] || id;

    V.mkt = () => `
      ${hdr("MARKETPLACE")}
      <div class="row">
        ${[["b", "BUY"], ["s", "SELL"], ["e", "SALES"]].map(([k, lbl]) => `
          <button class="btn ${mt === k ? "btn-gold" : ""}" style="padding:8px;font-size:11px" onclick="mt='${k}';go('mkt')">${lbl}</button>
        `).join("")}
      </div>
      <div id="mk"><div class="card">Loading marketplace...</div></div>
    `;

    V.mkt_ = async () => {
      const box = $("#mk");
      if (!box) return;
      if (!ON || !FDB) {
        box.innerHTML = '<div class="card">Connect online to trade skins with real players.</div>';
        return;
      }
      if (mt === "s") {
        const tradable = IT.filter((x) => S.own && S.own[x[1]] && ["gold", "royale", "re", "fe", "gb", "rc", "gf", "ff"].includes(x[1]));
        box.innerHTML = tradable.length
          ? `<div class="card"><select id="sk">${tradable.map((x) => `<option value="${x[1]}">${x[2]}</option>`).join("")}</select><input id="sp" type="number" placeholder="Price in Coins (min 100)" /><div class="mut">10% marketplace fee applies</div><button class="btn btn-gold" onclick="lst()">LIST SKIN</button></div>`
          : '<div class="card">No tradable skins owned yet.</div>';
        return;
      }
      if (mt === "e") {
        let rows = [];
        try {
          const snap = await FDB.ref(`earnings/${UID}`).once("value");
          rows = Object.values(snap.val() || {});
        } catch (_) {}
        const gross = rows.reduce((s, r) => s + (r.coins || 0), 0);
        const net = rows.reduce((s, r) => s + (r.net || 0), 0);
        box.innerHTML = `<div class="card">Sales: ${rows.length}<br>Gross: ${gross} Coins · Fee: -${gross - net}<br><span class="gold-txt" style="font-weight:800">Net: ${net} Coins</span></div>` +
          rows.map((r) => `<div class="card mut">${nmI(r.skin)} · ${r.coins} Coins · Net ${r.net}</div>`).join("");
        return;
      }
      let offers = [];
      try {
        const snap = await FDB.ref("marketplace").once("value");
        const raw = snap.val() || {};
        offers = Object.keys(raw).map((id) => ({
          id,
          seller: raw[id].sellerUsername,
          cc: raw[id].sellerFlag,
          skin: raw[id].skin,
          coins: raw[id].coins,
          own: raw[id].sellerID === UID
        }));
      } catch (_) {}
      offers.sort((a, b) => a.coins - b.coins);
      box.innerHTML = offers.length
        ? offers.map((o) => `
          <div class="card row">
            <div style="flex:3">
              <div style="font-weight:800">${esc(o.seller)} <span class="mut">· ${esc(o.cc || "")}</span></div>
              <div class="gold-txt" style="font-weight:800">${nmI(o.skin)} — ${fmt(o.coins)} Coins</div>
            </div>
            ${o.own
              ? `<button class="btn" style="flex:0 0 84px;margin:0;padding:8px;font-size:11px" onclick="mcx('${o.id}')">CANCEL</button>`
              : `<button class="btn btn-gold" style="flex:0 0 84px;margin:0;padding:8px;font-size:11px" onclick="mbuy('${o.id}')">BUY</button>`}
          </div>
        `).join("")
        : '<div class="card">No active listings right now.</div>';
    };

    async function mbuy(id) {
      if (!ON || !FDB || !UID) return toast("Offline");
      const ref = FDB.ref(`marketplace/${id}`);
      let off = null;
      await ref.transaction((v) => {
        off = null;
        if (!v || v.sellerID === UID) return v;
        off = v;
        return null;
      });
      if (!off) return toast("Offer unavailable");
      if (S.coins < off.coins) { await ref.set(off); return toast("Not enough Coins"); }
      const fee = Math.floor(off.coins * 0.1), net = off.coins - fee;
      addCoins(-off.coins);
      S.own[off.skin] = 1;
      sv();
      await FDB.ref(`users/${off.sellerID}/coins`).transaction((v) => (v || 0) + net).catch(() => {});
      await FDB.ref(`earnings/${off.sellerID}/${id}`).set({ skin: off.skin, coins: off.coins, fee, net, t: Date.now() }).catch(() => {});
      toast("Skin purchased");
      go("mkt");
    }

    async function mcx(id) {
      if (!ON || !FDB || !UID) return toast("Offline");
      const ref = FDB.ref(`marketplace/${id}`);
      let off = null;
      await ref.transaction((v) => {
        off = null;
        if (!v || v.sellerID !== UID) return v;
        off = v;
        return null;
      });
      if (!off) return toast("Offer not found");
      S.own[off.skin] = 1;
      sv();
      toast("Listing cancelled");
      go("mkt");
    }

    async function lst() {
      const sk = $("#sk").value;
      const coins = parseInt($("#sp").value, 10);
      if (!Number.isInteger(coins) || coins < 100) return toast("Minimum 100 Coins");
      if (!ON || !FDB || !UID) return toast("Offline");
      if (!S.own[sk]) return toast("Skin not owned");
      delete S.own[sk];
      for (const k in S.eq) if (S.eq[k] === sk) delete S.eq[k];
      sv();
      await FDB.ref("marketplace").push({
        sellerID: UID,
        sellerUsername: S.name,
        sellerFlag: S.cc,
        skin: sk,
        coins,
        t: Date.now()
      });
      toast("Listed");
      mt = "b";
      go("mkt");
    }

    // ===== PROFILE =====
    V.prof = () => {
      const losses = Math.max(0, S.games - S.wins);
      const winRate = S.games ? ((S.wins / S.games) * 100).toFixed(1) : "0.0";
      return `
        ${hdr("DAMA ROYALE 3D")}
        <div class="frame" style="text-align:center;padding:16px 12px">
          <div class="avatar-ring" style="width:84px;height:84px;font-size:28px;margin:0 auto 8px;cursor:pointer" onclick="S.av=AVATARS[(AVATARS.indexOf(S.av)+1)%AVATARS.length];sv();go('prof')">${esc(S.av)}</div>
          <div style="font-size:20px;font-weight:900;cursor:pointer" onclick="const n=prompt('Username',S.name);if(n){S.name=esc(n).trim().slice(0,14);sv();if(ON)NET.login();go('prof')}">${esc(S.name)}</div>
          <div style="display:inline-block;margin:6px 0 12px;padding:3px 12px;border-radius:12px;border:1px solid rgba(226,180,40,0.5);font-size:11px;font-weight:800;color:var(--gold1)">LEVEL ${lvl()} · ${esc(S.cc)}</div>

          <div class="g3" style="border-top:1px solid rgba(226,180,40,0.22);border-bottom:1px solid rgba(226,180,40,0.22);padding:10px 0">
            <div><div class="mut" style="font-size:10px;font-weight:800">WINS</div><div style="font-size:18px;font-weight:900">${fmt(S.wins)}</div></div>
            <div><div class="mut" style="font-size:10px;font-weight:800">LOSSES</div><div style="font-size:18px;font-weight:900">${fmt(losses)}</div></div>
            <div><div class="mut" style="font-size:10px;font-weight:800">W/L</div><div class="gold-txt" style="font-size:18px;font-weight:900">${winRate}%</div></div>
          </div>

          <div class="sec-hd" style="justify-content:center;border:0;margin:10px 0 6px">ECONOMY</div>
          <div class="card row" style="justify-content:space-between">
            <span class="row" style="justify-content:flex-start;gap:8px">${svgUse("ico-coin", 22, 22, "style='flex:none'")} <b>Total Coins</b></span>
            <span class="gold-txt" style="font-weight:900;font-size:15px">${fmt(S.coins)}</span>
          </div>
          <div class="card row" style="justify-content:space-between">
            <span class="mut" style="font-weight:800">Practice Coins (AI)</span>
            <span style="font-weight:800">${fmt(S.prac)}</span>
          </div>
          <div class="mut" style="margin-top:6px">Coins are for in-game items only · No cash value</div>
        </div>
        <button class="btn" onclick="go('earn')">EARN FREE COINS</button>
        <button class="btn" onclick="S.name='';sv();go('splash')">SWITCH ACCOUNT</button>
      `;
    };

    // ===== FIREBASE SPARK REALTIME LAYER =====
    const NET = { offs: [], st: "off", iv: null, qOff: null, off: 0 };
    const R = (p) => FDB.ref(p);
    const pub = () => ({ name: S.name, cc: S.cc, av: S.av });
    const SSV = () => firebase.database.ServerValue.TIMESTAMP;
    const on = (r, e, f) => { r.on(e, f); NET.offs.push([r, e, f]); };

    NET.leave = () => {
      clearInterval(NET.iv);
      NET.iv = null;
      if (NET.qOff) { try { NET.qOff.ref.off("value", NET.qOff.fn); } catch (_) {} NET.qOff = null; }
      camOff();
      NET.offs.forEach(([r, e, f]) => { try { r.off(e, f); } catch (_) {} });
      NET.offs = [];
    };

    if (firebaseConfig.apiKey && window.firebase) {
      try {
        if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
        FDB = firebase.database();
        NET.st = "try";
        firebase.auth().onAuthStateChanged((u) => {
          if (u) {
            UID = u.uid;
            if (S.name) NET.login();
          } else {
            firebase.auth().signInAnonymously().catch(() => {
              NET.st = "fail";
              if (cur === "home") V.home_();
            });
          }
        });
      } catch (_) {
        NET.st = "fail";
      }
    }

    window.NETSV = () => {
      if (!ON || !UID) return;
      R(`users/${UID}`).update({
        coins: S.coins,
        practiceCoins: S.prac,
        wins: S.wins,
        aiw: S.aiw,
        points: S.points || 0,
        elo: S.elo || 1200,
        own: S.own || { wood: 1 }
      }).catch(() => {});
      for (const k in S.eq) R(`users/${UID}/eq/${k}`).set(S.eq[k]).catch(() => {});
    };

    NET.login = async () => {
      if (NET.st === "off" || !UID || !S.name) return;
      ON = true;
      NET.st = "on";
      const r = R(`users/${UID}`);
      const snap = await r.once("value").catch(() => null);
      if (!snap || !snap.exists()) {
        await r.set({
          name: S.name, cc: S.cc, av: S.av,
          coins: S.coins, practiceCoins: S.prac,
          wins: S.wins, aiw: S.aiw, points: S.points || 0, elo: S.elo || 1200,
          own: S.own || { wood: 1 }, online: true, lastSeen: SSV()
        }).catch(() => {});
      } else {
        await r.update({ ...pub(), online: true, lastSeen: SSV() }).catch(() => {});
        const v = snap.val() || {};
        if (typeof v.coins === "number") S.coins = v.coins;
        if (typeof v.wins === "number") S.wins = v.wins;
        if (typeof v.points === "number") S.points = v.points;
        if (typeof v.elo === "number") S.elo = v.elo;
        if (v.own) S.own = v.own;
        try { localStorage.setItem("dama_spark_v1", JSON.stringify(S)); } catch (_) {}
      }

      R(".info/connected").on("value", (c) => {
        if (c.val()) {
          r.child("online").onDisconnect().set(false).catch(() => {});
          r.child("lastSeen").onDisconnect().set(SSV()).catch(() => {});
          r.child("online").set(true).catch(() => {});
          r.child("lastSeen").set(SSV()).catch(() => {});
        }
      });

      r.child("joinRoom").on("value", (j) => {
        const roomId = j.val();
        if (roomId) {
          r.child("joinRoom").remove().catch(() => {});
          NET.open(roomId);
        }
      });

      FDB.ref(".info/serverTimeOffset").on("value", (s) => { NET.off = s.val() || 0; });
      if (cur === "home") go("home");
    };

    NET.queue = async () => {
      if (S.coins < 20) return toast("Not enough Coins");
      addCoins(-20);
      const t0 = Date.now();
      const renderQ = (longWait) => modal(`
        <div style="text-align:center">
          <div style="margin-bottom:6px">${svgUse("ico-crown", 44, 30)}</div>
          <h3 class="royal-title" style="font-size:18px">SEARCHING OPPONENT</h3>
          <p class="mut" style="margin:8px 0 12px">${longWait ? "Still searching for another player..." : "Entry 20 Coins · Live 1v1 Match"}</p>
          <button class="btn" onclick="NET.cancel()">CANCEL (REFUND 20)</button>
        </div>
      `);
      NET.cancel = async () => {
        clearInterval(NET.iv);
        NET.iv = null;
        if (NET.qOff) { try { NET.qOff.ref.off("value", NET.qOff.fn); } catch (_) {} NET.qOff = null; }
        closeM();
        const qSnap = await R(`queue/${UID}`).once("value").catch(() => null);
        if (qSnap && qSnap.exists()) {
          await R(`queue/${UID}`).remove().catch(() => {});
          addCoins(20);
          toast("Refunded 20 Coins");
        }
        go("home");
      };
      renderQ(false);

      const myEntry = { uid: UID, name: S.name, cc: S.cc, av: S.av, elo: S.elo || 1200, t: Date.now() };
      await R(`queue/${UID}`).set(myEntry);

      const qRef = R("queue");
      const qFn = async (snap) => {
        const all = snap.val() || {};
        if (!all[UID]) return;
        const opp = Object.values(all).find((x) => x && x.uid !== UID);
        if (!opp) return;
        const roomId = R("rooms").push().key;
        const now = Date.now();
        await R(`rooms/${roomId}`).set({
          p1: { uid: opp.uid, name: opp.name, cc: opp.cc, av: opp.av },
          p2: { uid: UID, name: S.name, cc: S.cc, av: S.av },
          status: "playing",
          turn: 1,
          board: INIT_BOARD,
          cap: [0, 0],
          clock: [300, 300],
          at: now,
          n: 0,
          settled: false
        });
        await R(`queue/${opp.uid}`).remove().catch(() => {});
        await R(`queue/${UID}`).remove().catch(() => {});
        await R(`users/${opp.uid}/joinRoom`).set(roomId).catch(() => {});
        await R(`users/${UID}/joinRoom`).set(roomId).catch(() => {});
      };
      qRef.on("value", qFn);
      NET.qOff = { ref: qRef, fn: qFn };

      NET.iv = setInterval(() => {
        if (Date.now() - t0 > 12000 && $("#mod").style.display === "flex") renderQ(true);
      }, 1000);
    };

    NET.open = async (id) => {
      clearInterval(NET.iv);
      NET.iv = null;
      if (NET.qOff) { try { NET.qOff.ref.off("value", NET.qOff.fn); } catch (_) {} NET.qOff = null; }
      closeM();
      const rr = R(`rooms/${id}`);
      const rm = (await rr.once("value")).val();
      if (!rm) return;
      const me = rm.p1.uid === UID ? 1 : 2;
      const opp = me === 1 ? rm.p2 : rm.p1;
      newGame({ mode: "rm", me, room: id, opp: { name: opp.name, cc: opp.cc, av: opp.av, elo: 1200, uid: opp.uid } });
      const g = G;
      NET.sync(g, rm);
      on(rr, "value", (s) => { const v = s.val(); if (v && G === g) NET.sync(g, v); });
      on(rr.child("chat"), "child_added", (s) => {
        const m = s.val();
        const c = $("#cm");
        if (m && c) {
          c.innerHTML += `<div><b class="gold-txt">${esc(m.u)}:</b> ${esc(m.x)}</div>`;
          c.scrollTop = 1e5;
        }
      });
    };

    NET.sync = (g, v) => {
      if (!v || !v.board) return;
      g.b = v.board.split("").map(Number);
      g.t = v.turn;
      g.last = v.last || null;
      g.cap = v.cap || [0, 0];
      const el = (Date.now() + (NET.off || 0) - (v.at || Date.now())) / 1000;
      const clk = v.clock || [300, 300];
      g.tm = [Math.round(clk[0]), Math.round(clk[1])];
      g.tm[g.turn - 1] = Math.max(0, Math.round(g.tm[g.turn - 1] - el));
      g.mv = moves(g.b, g.t);
      g.sel = null;
      g.busy = 0;
      rb($("#bd"), g);
      hud();
      if (v.status === "done" && !g.over) {
        const outcome = v.winner ? (v.winner === UID ? "w" : "l") : "d";
        if (!g.settled) {
          g.settled = 1;
          if (outcome === "w") addCoins(40);
          else if (outcome === "d") addCoins(20);
        }
        setTimeout(() => { if (G === g) end(outcome); }, 450);
      }
    };

    NET.mv = async (g, m) => {
      g.busy = 1;
      g.sel = null;
      const nb = ap(g.b, m);
      const nextTurn = 3 - g.t;
      const cap = [...(g.cap || [0, 0])];
      cap[g.t - 1] += m.c.length;
      const nextN = (g.n || 0) + 1;
      const noMoves = !moves(nb, nextTurn).length;
      const isDraw = !noMoves && nextN > 150;
      const winnerUid = noMoves ? UID : null;
      await R(`rooms/${g.room}`).update({
        board: nb.join(""),
        turn: nextTurn,
        last: [m.p[0], m.p[m.p.length - 1]],
        cap,
        n: nextN,
        at: Date.now(),
        status: (noMoves || isDraw) ? "done" : "playing",
        winner: (noMoves || isDraw) ? winnerUid : null
      }).catch((e) => {
        toast((e && e.message) || "Move error");
        g.busy = 0;
        rb($("#bd"), g);
      });
    };

    NET.finishRoom = async (g, winnerSide, why) => {
      if (!g || !g.room || g.over) return;
      const rm = (await R(`rooms/${g.room}`).once("value")).val();
      if (!rm || rm.status === "done") return;
      const winnerUid = winnerSide === 1 ? rm.p1.uid : (winnerSide === 2 ? rm.p2.uid : null);
      await R(`rooms/${g.room}`).update({ status: "done", winner: winnerUid, why }).catch(() => {});
    };

    NET.to = (g) => {
      if (g.tof) return;
      g.tof = 1;
      NET.finishRoom(g, 3 - g.me, "timeout");
      setTimeout(() => { g.tof = 0; }, 3000);
    };

    NET.chat = (x) => {
      if (!G || !G.room) return;
      R(`rooms/${G.room}/chat`).push({ u: S.name, cc: S.cc, x, t: SSV() }).catch(() => toast("Chat failed"));
    };

    ROYAL_AUDIO.init();
    META_ADS.initTestConfig();
    go(S.name ? "home" : "splash");
    if (S.name) NET.login();
    if ("serviceWorker" in navigator) {
      addEventListener("load", () => navigator.serviceWorker.register("/sw.js").catch(() => {}));
    }
  </script>
</body>
</html>
